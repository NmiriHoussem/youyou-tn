<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حروفي الأولى — لعبة المطابقة</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap');
  :root{
    --cream:#FFFBF2; --ink:#4A4238; --soft:#8B8178;
    --red:#D85053; --yellow:#ECC552; --purple:#775C9E; --green:#46A86E; --sky:#BBD9F2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Baloo Bhaijaan 2', system-ui, sans-serif;
    background:var(--cream); color:var(--ink);
    overflow:hidden; touch-action:manipulation;
    display:flex; flex-direction:column; height:100dvh;
  }
  /* top bar */
  .bar{display:flex; align-items:center; justify-content:space-between; padding:12px 18px; gap:10px; flex:0 0 auto;}
  .backlink{display:flex; align-items:center; gap:6px; text-decoration:none; color:var(--ink,#3E3730);
    font-weight:700; font-size:clamp(13px,3vw,15px); background:#fff; border-radius:999px;
    padding:8px 14px; box-shadow:0 2px 0 rgba(0,0,0,.06); flex:0 0 auto; white-space:nowrap;}
  .backlink svg{width:16px; height:16px; flex:0 0 auto;}
  .title{font-size:clamp(20px,4.5vw,30px); font-weight:800; color:var(--red);}
  .btns{display:flex; gap:8px;}
  .chip{
    border:none; font-family:inherit; font-weight:700; font-size:clamp(13px,3vw,17px);
    padding:8px 16px; border-radius:999px; background:#fff; color:var(--ink);
    box-shadow:0 2px 0 rgba(0,0,0,.08); cursor:pointer; transition:transform .1s;
  }
  .chip:active{transform:scale(.94);}
  .chip.on{background:var(--purple); color:#fff;}
  .chip.small{padding:7px 13px;}
  /* board */
  .stage{flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:6px 12px 14px; min-height:0;}
  .grid{display:grid; gap:clamp(8px,2vw,16px); width:100%; max-width:900px; margin:auto;}
  .card{
    position:relative; aspect-ratio:1/1; border-radius:20px; cursor:pointer;
    perspective:800px; transition:transform .12s;
  }
  .card:active{transform:scale(.97);}
  .inner{position:absolute; inset:0; transition:transform .45s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;}
  .card.flipped .inner, .card.matched .inner{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:20px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.06), inset 0 0 0 3px var(--fc,#ddd);
    overflow:hidden;
  }
  .back{
    background:var(--sky); box-shadow:0 4px 0 rgba(0,0,0,.06);
    background-image:radial-gradient(rgba(255,255,255,.55) 3px, transparent 3px);
    background-size:22px 22px;
  }
  .back::after{
    content:"ح"; font-weight:800; font-size:34%; color:#fff;
    width:58%; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.25); border-radius:50%;
  }
  .front{transform:rotateY(180deg);}
  .glyph{font-size:clamp(40px,13vw,90px); font-weight:800; line-height:1;}
  .animal{width:64%; height:64%; object-fit:contain; margin-bottom:2%;}
  .word{font-size:clamp(15px,3.6vw,26px); font-weight:700; color:var(--ink);}
  .card.matched{animation:pop .55s cubic-bezier(.3,1.4,.5,1);}
  @keyframes pop{0%{transform:scale(1);}35%{transform:scale(1.2) rotate(-3deg);}60%{transform:scale(1.12) rotate(3deg);}100%{transform:scale(1) rotate(0);}}
  .card.matched .face{box-shadow:0 4px 0 rgba(0,0,0,.06), inset 0 0 0 5px var(--green);}
  /* matched cards become disabled + grayed */
  .card.done{pointer-events:none; cursor:default;}
  .card.done .inner{transition:filter .4s, opacity .4s;}
  .card.done .front{filter:grayscale(1) opacity(.45); box-shadow:0 4px 0 rgba(0,0,0,.04), inset 0 0 0 3px #cfcfcf;}
  .card.done .glyph{color:#b8b8b8 !important;}
  .card.done .word{color:#b8b8b8;}
  .card.done .check{opacity:1; transform:scale(1);}
  .check{position:absolute; top:6%; inset-inline-start:6%; width:26%; height:26%;
    background:var(--green); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:60%; font-weight:800; opacity:0; transform:scale(.3); transition:all .35s cubic-bezier(.3,1.5,.5,1); z-index:3; box-shadow:0 2px 4px rgba(0,0,0,.15);}
  /* clearer wrong effect: intense buzz + full red, then smooth return */
  .card.wrong .face{animation:buzz .6s;}
  .card.wrong .front{
    box-shadow:0 4px 0 rgba(0,0,0,.06), inset 0 0 0 6px var(--red);
    background:#ffdada;
    animation:redflash .6s;
  }
  .card.wrong .glyph{animation:redtext .6s;}
  .card.wrong .word{animation:redtext .6s;}
  @keyframes redtext{0%,100%{color:inherit;}15%,70%{color:var(--red);}}
  @keyframes redflash{
    0%{background:#fff;}
    12%{background:#ffb3b3;}
    70%{background:#ffb3b3;}
    100%{background:#fff;}
  }
  @keyframes buzz{
    0%{transform:translate(0,0) rotate(0);}
    8%{transform:translate(-13px,2px) rotate(-5deg);}
    16%{transform:translate(12px,-2px) rotate(5deg);}
    24%{transform:translate(-12px,2px) rotate(-4deg);}
    32%{transform:translate(11px,-1px) rotate(4deg);}
    40%{transform:translate(-9px,1px) rotate(-3deg);}
    48%{transform:translate(8px,-1px) rotate(3deg);}
    56%{transform:translate(-6px,1px) rotate(-2deg);}
    64%{transform:translate(5px,0) rotate(2deg);}
    72%{transform:translate(-3px,0) rotate(-1deg);}
    100%{transform:translate(0,0) rotate(0);}
  }
  .card.wrong{animation:wrongScale .6s;}
  @keyframes wrongScale{0%,100%{transform:scale(1);}20%{transform:scale(1.06);}45%{transform:scale(1.03);}}
  /* burst particles on a correct match */
  .burst{position:fixed; width:14px; height:14px; z-index:25; pointer-events:none; border-radius:3px;}
  /* matching mode: two rows */
  .card.picked .face{box-shadow:0 4px 0 rgba(0,0,0,.06), inset 0 0 0 4px var(--purple);}
  /* win overlay */
  .win{position:fixed; inset:0; background:rgba(255,251,242,.94); display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:20px; z-index:20; text-align:center; padding:20px;}
  .win.show{display:flex; animation:fade .3s;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .win h1{font-size:clamp(38px,10vw,72px); color:var(--green); font-weight:800;}
  .win p{font-size:clamp(18px,4.5vw,26px); color:var(--soft);}
  .win .again{background:var(--red); color:#fff; font-size:clamp(20px,5vw,28px); font-weight:800;
    border:none; border-radius:999px; padding:16px 40px; box-shadow:0 5px 0 rgba(0,0,0,.15); cursor:pointer;}
  .win .again:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.15);}
  .confetti{position:fixed; top:-10px; width:12px; height:12px; z-index:19; border-radius:2px; pointer-events:none;}
  .level{font-size:clamp(13px,3vw,16px); color:var(--soft); font-weight:700;}

  /* score bar (match mode only) */
  .scorebar{display:none; align-items:center; justify-content:center; gap:10px; padding:0 18px 8px; flex:0 0 auto;}
  body.match .scorebar{display:flex;}
  body.match #btnLevel{display:none;}   /* level button is for memory mode only */
  .score-pill{display:flex; align-items:center; gap:8px; background:#fff; border-radius:999px;
    padding:7px 16px; box-shadow:0 2px 0 rgba(0,0,0,.07); font-weight:800;}
  .score-pill .lbl{font-size:clamp(11px,2.6vw,14px); color:var(--soft); font-weight:700;}
  .score-pill .val{font-size:clamp(17px,4vw,24px); color:var(--red); min-width:1.2em; text-align:center;}
  .score-pill.lvl .val{color:var(--purple);}
  .score-pill.prog{color:var(--green); font-size:clamp(13px,3vw,17px);}
  .score-pop{animation:scorePop .4s;}
  @keyframes scorePop{0%,100%{transform:scale(1);}45%{transform:scale(1.35);}}

  /* +10 floating point */
  .plus{position:fixed; z-index:26; font-weight:800; color:var(--green);
    font-size:clamp(22px,5vw,34px); pointer-events:none;}

  /* level-up banner */
  .levelup{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:24;
    background:rgba(255,251,242,.5);}
  .levelup.show{display:flex;}
  .lu-card{background:#fff; border-radius:28px; padding:32px 46px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.18); animation:luPop .5s cubic-bezier(.3,1.5,.5,1);}
  @keyframes luPop{0%{transform:scale(.5); opacity:0;}100%{transform:scale(1); opacity:1;}}
  .lu-emoji{font-size:64px; line-height:1; animation:spin 1s ease;}
  @keyframes spin{from{transform:rotate(-30deg) scale(.6);}to{transform:rotate(0) scale(1);}}
  .lu-card h2{color:var(--purple); font-size:clamp(26px,6vw,40px); font-weight:800; margin:6px 0;}
  .lu-card p{color:var(--soft); font-size:clamp(16px,4vw,22px); font-weight:700;}
</style>
</head>

  <div class="bar">
    <a class="backlink" href="product-houroufi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>

    <button class="again" onclick="hideWin();newGame()">اِلْعَبْ مَرَّةً أُخْرَى</button>
  </div>

let mode='match';         // 'memory' | 'match'
let levelPairs=6;          // memory mode: 6,12,28
const LEVELS=[6,12,28];
const MATCH_PAIRS=6;       // match mode is always 6 pairs (12 cards) per page
let score=0, matchLevel=1; // match-mode score + page/level
let deck=[], first=null, second=null, lock=false, matched=0, pickLetter=null, pickAnimal=null;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function pickCards(n){
  // choose n distinct letters
  const idx=shuffle([...Array(CARDS.length).keys()]).slice(0,n);
  return idx.map(i=>CARDS[i]);
}

function gridCols(count){
  // aim for near-square grid that fits
  if(count<=8) return 4;
  if(count<=12) return 4;
  if(count<=24) return 6;
  return 7;
}

function currentPairs(){ return mode==='match' ? MATCH_PAIRS : levelPairs; }

function newGame(){
  const grid=document.getElementById('grid');
  grid.innerHTML=''; first=second=null; lock=false; matched=0; pickLetter=pickAnimal=null;
  const pairs=currentPairs();
  const chosen=pickCards(pairs);
  // build two cards per letter: a letter card and an animal card
  let tiles=[];
  chosen.forEach((c,k)=>{
    tiles.push({pair:k, type:'letter', data:c});
    tiles.push({pair:k, type:'animal', data:c});
  });
  shuffle(tiles);
  const cols=gridCols(tiles.length);
  grid.style.gridTemplateColumns=`repeat(${cols}, 1fr)`;
  updateScoreUI();
  // size rows to fit height
  tiles.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='card'; el.dataset.pair=t.pair; el.dataset.type=t.type; el.dataset.i=i;
    el.style.setProperty('--fc', t.data.color);
    const faceContent = t.type==='letter'
      ? `<div class="glyph" style="color:${t.data.color}">${t.data.letter}</div>`
      : `<img class="animal" src="${t.data.img}" alt=""><div class="word">${t.data.word}</div>`;
    el.innerHTML=`<div class="inner">
        <div class="face back"></div>
        <div class="face front">${faceContent}<div class="check">✓</div></div>
      </div>`;
    el.onclick=()=>onTap(el);
    grid.appendChild(el);
  });
  // memory starts face-down; match starts face-up
  if(mode==='match'){
    document.querySelectorAll('.card').forEach(c=>c.classList.add('flipped'));
  }
}

function onTap(el){
  if(lock) return;
  if(el.classList.contains('matched')||el.classList.contains('done')) return;

  if(mode==='memory'){
    if(el.classList.contains('flipped')) return;
    el.classList.add('flipped');
    if(!first){ first=el; return; }
    second=el; lock=true;
    checkPair(first,second,()=>{
      first.classList.remove('flipped'); second.classList.remove('flipped');
      first=second=null; lock=false;
    },()=>{ first=second=null; lock=false; });
  } else {
    // match mode: pick one letter then one animal (or vice versa)
    const type=el.dataset.type;
    if(el.classList.contains('picked')){ el.classList.remove('picked'); if(type==='letter')pickLetter=null; else pickAnimal=null; return; }
    el.classList.add('picked');
    if(type==='letter') pickLetter=el; else pickAnimal=el;
    if(pickLetter && pickAnimal){
      lock=true;
      const a=pickLetter, b=pickAnimal;
      checkPair(a,b,()=>{ a.classList.remove('picked'); b.classList.remove('picked'); pickLetter=pickAnimal=null; lock=false; },
                       ()=>{ pickLetter=pickAnimal=null; lock=false; });
    }
  }
}

function checkPair(a,b,onFail,onDone){
  const ok = a.dataset.pair===b.dataset.pair && a.dataset.type!==b.dataset.type;
  if(ok){
    setTimeout(()=>{
      a.classList.add('matched'); b.classList.add('matched');
      burstAt(a); burstAt(b);
      matched++; onDone&&onDone();
      if(mode==='match'){ addScore(10, a); }   // score only in match mode
      // after the celebration, disable + gray the pair
      setTimeout(()=>{
        a.classList.add('done'); b.classList.add('done');
        a.classList.remove('picked','flipped'); b.classList.remove('picked','flipped');
      },550);
      if(matched===currentPairs()){
        if(mode==='match') setTimeout(levelUp,650);
        else setTimeout(win,650);
      }
    },300);
  } else {
    a.classList.add('wrong'); b.classList.add('wrong');
    setTimeout(()=>{ a.classList.remove('wrong'); b.classList.remove('wrong'); onFail&&onFail(); },720);
  }
}

function addScore(pts, el){
  score+=pts;
  updateScoreUI();
  const sv=document.getElementById('scoreVal');
  sv.classList.remove('score-pop'); void sv.offsetWidth; sv.classList.add('score-pop');
  // floating +10 from the matched card
  if(el){
    const r=el.getBoundingClientRect();
    const f=document.createElement('div'); f.className='plus'; f.textContent='+'+pts;
    f.style.left=(r.left+r.width/2-14)+'px'; f.style.top=(r.top+10)+'px';
    document.body.appendChild(f);
    f.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-60px)',opacity:0}],
              {duration:800,easing:'ease-out'});
    setTimeout(()=>f.remove(),820);
  }
}

function updateScoreUI(){
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('levelVal').textContent=matchLevel;
  document.getElementById('progVal').textContent = `${matched} / ${MATCH_PAIRS}`;
}

function levelUp(){
  matchLevel++;
  score+=20;                 // page-complete bonus
  const lu=document.getElementById('levelup');
  document.getElementById('luText').textContent='المُسْتَوَى '+matchLevel;
  lu.classList.add('show');
  bigConfetti();
  setTimeout(()=>{
    lu.classList.remove('show');
    newGame();               // next page: 12 fresh cards
  },1600);
}

// confetti burst emitted from a specific card
function burstAt(el){
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const cols=['#D85053','#ECC552','#775C9E','#46A86E','#BBD9F2','#ffffff'];
  const shapes=16;
  for(let i=0;i<shapes;i++){
    const s=document.createElement('div'); s.className='burst';
    s.style.left=cx+'px'; s.style.top=cy+'px';
    s.style.background=cols[i%cols.length];
    if(i%2){ s.style.borderRadius='50%'; }
    document.body.appendChild(s);
    const ang=(Math.PI*2*i/shapes)+Math.random()*.4;
    const dist=60+Math.random()*70;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
    s.animate([
      {transform:'translate(0,0) scale(1) rotate(0)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(.3) rotate(${Math.random()*360}deg)`,opacity:0}
    ],{duration:600+Math.random()*300,easing:'cubic-bezier(.2,.7,.3,1)'});
    setTimeout(()=>s.remove(),950);
  }
}

function setMode(m){
  mode=m;
  document.getElementById('mMemory').classList.toggle('on',m==='memory');
  document.getElementById('mMatch').classList.toggle('on',m==='match');
  document.body.classList.toggle('match', m==='match');
  if(m==='match'){ score=0; matchLevel=1; }   // fresh run each time you enter match mode
  newGame();
}
function cycleLevel(){
  const i=(LEVELS.indexOf(levelPairs)+1)%LEVELS.length;
  levelPairs=LEVELS[i];
  document.getElementById('btnLevel').textContent=levelPairs;
  newGame();
}
function win(){
  const w=document.getElementById('win'); w.classList.add('show');
  document.getElementById('winSub').textContent = `طابَقْتَ ${levelPairs} أَزْواج!`;
  confetti();
}
function hideWin(){document.getElementById('win').classList.remove('show');}
function confetti(){ bigConfetti(); }
function bigConfetti(){
  const cols=['#D85053','#ECC552','#775C9E','#46A86E','#BBD9F2'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=cols[i%cols.length];
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    const dur=1400+Math.random()*1600;
    c.animate([{top:'-10px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});
    setTimeout(()=>c.remove(),dur);
  }
}
// fit grid rows to viewport height
function fitRows(){
  const grid=document.getElementById('grid');
  const cols=parseInt(getComputedStyle(grid).gridTemplateColumns.split(' ').length)||4;
  const count=grid.children.length; if(!count) return;
  const rows=Math.ceil(count/cols);
  const stage=document.querySelector('.stage');
  const gap=parseFloat(getComputedStyle(grid).gap)||12;
  const availH=stage.clientHeight - (rows-1)*gap - 4;
  const availW=grid.clientWidth - (cols-1)*gap;
  const cell=Math.min(availW/cols, availH/rows);
  grid.style.maxWidth=(cell*cols + (cols-1)*gap)+'px';
}
const _ng=newGame; newGame=function(){_ng();requestAnimationFrame(fitRows);}
window.addEventListener('resize',fitRows);
setMode('match');
</script>
